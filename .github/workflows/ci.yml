name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test AdminStats
        run: dotnet run --project tests/SjolystInnovation.AppKit.AdminStats.Tests --configuration Release --no-build

      - name: Test Auth
        run: dotnet run --project tests/SjolystInnovation.AppKit.Auth.Tests --configuration Release --no-build

      - name: Test Consent
        run: dotnet run --project tests/SjolystInnovation.AppKit.Consent.Tests --configuration Release --no-build

      - name: Test Email
        run: dotnet run --project tests/SjolystInnovation.AppKit.Email.Tests --configuration Release --no-build

      - name: Test Hosting
        run: dotnet run --project tests/SjolystInnovation.AppKit.Hosting.Tests --configuration Release --no-build

      # The runner image has Google Chrome, so the Pdf tests also render through a real browser.
      - name: Test Pdf
        run: dotnet run --project tests/SjolystInnovation.AppKit.Pdf.Tests --configuration Release --no-build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Test SiteSettings
        run: dotnet run --project tests/SjolystInnovation.AppKit.SiteSettings.Tests --configuration Release --no-build

      - name: Test Storage
        run: dotnet run --project tests/SjolystInnovation.AppKit.Storage.Tests --configuration Release --no-build

      - name: Test Storage.Images
        run: dotnet run --project tests/SjolystInnovation.AppKit.Storage.Images.Tests --configuration Release --no-build

      - name: Test VatThreshold
        run: dotnet run --project tests/SjolystInnovation.AppKit.VatThreshold.Tests --configuration Release --no-build

      - name: Test Vipps
        run: dotnet run --project tests/SjolystInnovation.AppKit.Vipps.Tests --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/SjolystInnovation.AppKit.AdminStats --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Auth --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Consent --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Email --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Hosting --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Pdf --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.SiteSettings --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Storage --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Storage.Images --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.VatThreshold --configuration Release --no-build --output artifacts
          dotnet pack src/SjolystInnovation.AppKit.Vipps --configuration Release --no-build --output artifacts
