name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet run --project tests/Si.Vipps.Tests --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Si.Vipps --configuration Release --no-build --output artifacts
